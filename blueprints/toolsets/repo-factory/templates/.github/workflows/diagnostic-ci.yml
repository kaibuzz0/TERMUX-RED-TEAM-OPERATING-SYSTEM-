name: Diagnostic CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --upgrade "pytest>=8,<10"
      - name: Run test suite
        id: tests
        continue-on-error: true
        run: python -m pytest tests/ -vv --tb=short --junitxml=test-results.xml
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn
      - name: Validation summary
        if: always()
        run: |
          echo "### Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests: ${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail after diagnostics
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "Tests failed. Review the named failing test, short traceback, and uploaded JUnit XML."
            exit 1
          fi
