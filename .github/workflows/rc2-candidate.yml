name: Build Hive RC.2 Candidate

on:
  push:
    branches: [ hive-1.1-rc2-bootstrap, hive-v2-remediation ]
    paths:
      - ".github/workflows/rc2-candidate.yml"
      - ".github/workflows/rc1-baseline-audit.yml"
      - "release_engine/**"
      - "bootstrap/**"
      - "installer/**"
      - "updates/**"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      version:
        description: "RC version to build"
        required: true
        default: "1.1.0-rc.2"
        type: string

permissions:
  contents: read

env:
  RC1_METADATA_URL: "https://github.com/kaibuzz0/TERMUX-RED-TEAM-OPERATING-SYSTEM-/releases/download/hive-os-v1.1.0-rc.1/metadata.signed.json"
  RC1_METADATA_SHA256: "96567a1380aef1516c487900313ee099646cd5af70eb6c42308a01ef9a08149e"

jobs:
  candidate:
    name: Reproducible unsigned RC.2 candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate workflow action pins
        run: python scripts/validate_workflow_pins.py

      - name: Resolve exact RC.1 anti-rollback baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/rc1-metadata.signed.json"
          curl --fail --location --proto '=https' --tlsv1.2 "$RC1_METADATA_URL" -o "$baseline"
          printf '%s  %s\n' "$RC1_METADATA_SHA256" "$baseline" | sha256sum --check --strict
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads((Path(os.environ["RUNNER_TEMP"]) / "rc1-metadata.signed.json").read_text(encoding="utf-8"))
          release = metadata.get("release")
          if not isinstance(release, dict):
              raise SystemExit("RC.1 metadata has no release block")
          if release.get("version") != "1.1.0-rc.1":
              raise SystemExit(f"unexpected RC.1 version: {release.get('version')!r}")
          expected_release_id = "hive-os-1.1.0-rc.1-20260815-parity"
          if release.get("release_id") != expected_release_id:
              raise SystemExit(f"unexpected RC.1 release id: {release.get('release_id')!r}")
          signing = metadata.get("signing")
          if not isinstance(signing, dict) or signing.get("key_id") != "hive-parity-test-2026-01":
              raise SystemExit(f"unexpected RC.1 signing key id: {signing.get('key_id') if isinstance(signing, dict) else None!r}")
          sequence = release.get("security_sequence", release.get("release_sequence"))
          if not isinstance(sequence, int) or isinstance(sequence, bool) or sequence < 0:
              raise SystemExit("RC.1 metadata has no valid monotonic sequence")
          rc2_sequence = sequence + 1
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"RC1_SEQUENCE={sequence}\n")
              handle.write(f"RC2_SEQUENCE={rc2_sequence}\n")
          print(f"Published RC.1 sequence: {sequence}")
          print(f"Required RC.2 sequence: {rc2_sequence}")
          PY

      - name: Validate candidate inputs
        shell: bash
        env:
          VERSION: "${{ github.event_name == 'workflow_dispatch' && inputs.version || '1.1.0-rc.2' }}"
        run: |
          set -euo pipefail
          case "$VERSION" in
            *-rc.*) ;;
            *) echo "Candidate version must be an RC prerelease" >&2; exit 2 ;;
          esac
          if ! [[ "$RC2_SEQUENCE" =~ ^[0-9]+$ ]]; then
            echo "resolved RC.2 sequence must be a non-negative integer" >&2
            exit 2
          fi
          echo "RC2_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Pin deterministic build identity
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "HIVE_BUILD_ID=rc2-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Build candidate twice
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/hive-rc2-a" "$RUNNER_TEMP/hive-rc2-b"
          python -m release_engine.cli build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/hive-rc2-a" \
            --version "$RC2_VERSION" \
            --sequence "$RC2_SEQUENCE" \
            --build-id "$HIVE_BUILD_ID" \
            --revision "$GITHUB_SHA" \
            --platforms termux \
            --architectures aarch64 \
            --channel rc
          python -m release_engine.cli build \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/hive-rc2-b" \
            --version "$RC2_VERSION" \
            --sequence "$RC2_SEQUENCE" \
            --build-id "$HIVE_BUILD_ID" \
            --revision "$GITHUB_SHA" \
            --platforms termux \
            --architectures aarch64 \
            --channel rc

      - name: Prove candidate reproducibility
        shell: bash
        run: |
          set -euo pipefail
          a_bundle=$(find "$RUNNER_TEMP/hive-rc2-a" -maxdepth 1 -name '*.tar.gz' -print -quit)
          b_bundle=$(find "$RUNNER_TEMP/hive-rc2-b" -maxdepth 1 -name '*.tar.gz' -print -quit)
          a_metadata=$(find "$RUNNER_TEMP/hive-rc2-a" -maxdepth 1 -name '*.metadata.json' -print -quit)
          b_metadata=$(find "$RUNNER_TEMP/hive-rc2-b" -maxdepth 1 -name '*.metadata.json' -print -quit)
          a_manifest=$(find "$RUNNER_TEMP/hive-rc2-a" -maxdepth 1 -name '*.manifest.json' -print -quit)
          b_manifest=$(find "$RUNNER_TEMP/hive-rc2-b" -maxdepth 1 -name '*.manifest.json' -print -quit)
          test -n "$a_bundle" && test -n "$b_bundle"
          test -n "$a_metadata" && test -n "$b_metadata"
          test -n "$a_manifest" && test -n "$b_manifest"
          cmp --silent "$a_bundle" "$b_bundle"
          cmp --silent "$a_metadata" "$b_metadata"
          cmp --silent "$a_manifest" "$b_manifest"
          echo "Reproducible bundle: $(sha256sum "$a_bundle" | cut -d' ' -f1)"

      - name: Validate runtime release shape
        shell: bash
        run: |
          set -euo pipefail
          bundle=$(find "$RUNNER_TEMP/hive-rc2-a" -maxdepth 1 -name '*.tar.gz' -print -quit)
          metadata=$(find "$RUNNER_TEMP/hive-rc2-a" -maxdepth 1 -name '*.metadata.json' -print -quit)
          manifest=$(find "$RUNNER_TEMP/hive-rc2-a" -maxdepth 1 -name '*.manifest.json' -print -quit)
          export BUNDLE="$bundle" METADATA="$metadata" MANIFEST="$manifest"
          python - <<'PY'
          import json
          import os
          import tarfile
          from pathlib import Path

          bundle = Path(os.environ["BUNDLE"])
          metadata = json.loads(Path(os.environ["METADATA"]).read_text(encoding="utf-8"))
          manifest = json.loads(Path(os.environ["MANIFEST"]).read_text(encoding="utf-8"))
          paths = {entry["path"] for entry in manifest}
          required = {
              "bin/hive",
              "bin/hive-os",
              "hive-canonical.json",
              "core/__init__.py",
              "installer/activate.py",
              "installer/autoboot.py",
              "installer/plan.py",
              "installer/schema.py",
              "network/manager.py",
              "services/supervisor.py",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"candidate manifest missing required runtime file: {missing[0]}")
          forbidden_prefixes = ("blueprints/", "evidence/")
          forbidden = sorted(path for path in paths if path.startswith(forbidden_prefixes))
          if forbidden:
              raise SystemExit(f"candidate manifest contains reference-only path: {forbidden[0]}")
          release = metadata.get("release", {})
          if release.get("commit") != os.environ["GITHUB_SHA"]:
              raise SystemExit("candidate metadata is not bound to the workflow commit")
          if release.get("security_sequence") != int(os.environ["RC2_SEQUENCE"]):
              raise SystemExit("candidate security sequence mismatch")
          if release.get("platforms") != ["termux"] or release.get("architectures") != ["aarch64"]:
              raise SystemExit("candidate platform/architecture contract mismatch")
          with tarfile.open(bundle, "r:gz") as archive:
              names = archive.getnames()
          if len(names) != len(set(names)):
              raise SystemExit("candidate bundle contains duplicate archive members")
          if set(names) != paths | {"manifest.json", "metadata.json"}:
              raise SystemExit("candidate archive does not exactly match manifest closure")
          print(f"Candidate release shape validated: {release.get('release_id')}")
          PY

      - name: Inspect unsigned bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle=$(find "$RUNNER_TEMP/hive-rc2-a" -maxdepth 1 -name '*.tar.gz' -print -quit)
          python -m release_engine.cli inspect "$bundle" --work-dir "$RUNNER_TEMP/hive-rc2-inspect"

      - name: Assemble offline-signing kit
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/dist/rc2-candidate"
          gate_stage="$RUNNER_TEMP/hive-release-gate"
          rm -rf "$out" "$gate_stage"
          mkdir -p "$out" "$gate_stage"
          cp "$RUNNER_TEMP/hive-rc2-a"/* "$out/"

          python -m zipapp bootstrap -o "$out/hive-bootstrap.pyz"
          python "$out/hive-bootstrap.pyz" install --help >/dev/null
          python "$out/hive-bootstrap.pyz" verify --help >/dev/null

          cp -R release_engine "$gate_stage/release_engine"
          cp -R bootstrap "$gate_stage/bootstrap"
          python -m zipapp "$gate_stage" -m "release_engine.candidate_gate:main" -o "$out/hive-release-gate.pyz"
          python "$out/hive-release-gate.pyz" --help >/dev/null

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path("dist/rc2-candidate")
          bundle = next(out.glob("*.tar.gz"))
          metadata = next(out.glob("*.metadata.json"))
          manifest = next(out.glob("*.manifest.json"))
          info = {
              "status": "unsigned_candidate_only",
              "version": os.environ["RC2_VERSION"],
              "rc1_sequence": int(os.environ["RC1_SEQUENCE"]),
              "security_sequence": int(os.environ["RC2_SEQUENCE"]),
              "source_revision": os.environ["GITHUB_SHA"],
              "source_date_epoch": int(os.environ["SOURCE_DATE_EPOCH"]),
              "build_id": os.environ["HIVE_BUILD_ID"],
              "expected_production_key_id": "hive-release-prod-2026-02",
              "bundle": bundle.name,
              "metadata": metadata.name,
              "manifest": manifest.name,
              "bootstrap": "hive-bootstrap.pyz",
              "post_sign_gate": "hive-release-gate.pyz",
              "next_step": (
                  "offline-sign the metadata with hive-release-prod-2026-02, then run "
                  "`python hive-release-gate.pyz --candidate-dir . --signed-metadata <signed.json> "
                  "--output publishable`"
              ),
          }
          (out / "CANDIDATE.json").write_text(
              json.dumps(info, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

          (
            cd "$out"
            sha256sum *.tar.gz *.json *.pyz > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - name: Upload unsigned RC.2 candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hive-rc2-unsigned-${{ github.sha }}
          path: dist/rc2-candidate/
          if-no-files-found: error
          retention-days: 7
