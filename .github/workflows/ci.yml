name: Hive Ops DevAI CI

on:
  push:
    branches: [ master, main, develop, hive-1.1-rc2-bootstrap ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        flake8 "Hive Ops DevAI" --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 "Hive Ops DevAI" --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

    - name: Type check with mypy
      run: |
        mypy "Hive Ops DevAI" --ignore-missing-imports || true

    - name: Test with pytest
      id: pytest
      continue-on-error: true
      shell: bash
      run: |
        set -o pipefail
        pytest -v "Hive Ops DevAI" tests --cov=. --cov-report=xml --cov-report=term-missing --junitxml=pytest-report.xml 2>&1 | tee pytest-output.txt

    - name: Surface pytest failures
      if: steps.pytest.outcome == 'failure'
      run: |
        python - <<'PY'
        from pathlib import Path

        output_path = Path("pytest-output.txt")
        if not output_path.is_file():
            print("::error title=pytest failure::Pytest failed before diagnostics were captured.")
            raise SystemExit(1)

        output = output_path.read_text(encoding="utf-8", errors="replace")
        lines = output.splitlines()
        summary = [line for line in lines if line.startswith(("FAILED ", "ERROR "))]

        def emit(text: str) -> None:
            text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
            print(f"::error title=pytest failure::{text}")

        if summary:
            for line in summary[:40]:
                emit(line)
        else:
            start = next(
                (
                    i
                    for i, line in enumerate(lines)
                    if line.startswith("=================================== FAILURES")
                    or line.startswith("==================================== ERRORS")
                ),
                max(0, len(lines) - 30),
            )
            emit("\n".join(lines[start : start + 30]))
        raise SystemExit(1)
        PY

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        pip install bandit safety

    - name: Run bandit security scan
      run: |
        # Keep a machine-readable report even when findings exist, then enforce
        # the release gate with a second medium-or-higher severity scan.
        bandit -r "Hive Ops DevAI" bootstrap installer updates -f json -o bandit-report.json || true
        bandit -r "Hive Ops DevAI" bootstrap installer updates -ll

    - name: Upload security scan results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-scan
        path: bandit-report.json

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Create distribution package
      run: |
        mkdir -p dist
        tar -czf dist/hive-ops-devai.tar.gz \
          --exclude=.git \
          --exclude=__pycache__ \
          --exclude=*.pyc \
          --exclude=.pytest_cache \
          --exclude=brain-plug/escape_living_ai.txt \
          "Hive Ops DevAI" "Hive Ops Final" "Hermes Plugins" brain-plug install.sh README.md requirements.txt

    - name: Create standalone clean-install bootstrap
      run: |
        python -m zipapp bootstrap -o dist/hive-bootstrap.pyz
        python dist/hive-bootstrap.pyz --help
        python dist/hive-bootstrap.pyz install --help
        python dist/hive-bootstrap.pyz verify --help
        sha256sum dist/hive-bootstrap.pyz > dist/hive-bootstrap.pyz.sha256

    - name: Upload Hive package
      uses: actions/upload-artifact@v4
      with:
        name: hive-ops-package
        path: dist/hive-ops-devai.tar.gz

    - name: Upload clean-install bootstrap
      uses: actions/upload-artifact@v4
      with:
        name: hive-clean-install-bootstrap
        path: |
          dist/hive-bootstrap.pyz
          dist/hive-bootstrap.pyz.sha256
