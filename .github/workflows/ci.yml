name: Hive Ops DevAI CI

on:
  push:
    branches: [ master, main, develop, hive-1.1-rc2-bootstrap ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        flake8 "Hive Ops DevAI" --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 "Hive Ops DevAI" --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

    - name: Type check with mypy
      run: |
        mypy "Hive Ops DevAI" --ignore-missing-imports || true

    - name: Test with pytest
      id: pytest
      shell: bash
      run: |
        set +e
        pytest -v "Hive Ops DevAI" tests --cov=. --cov-report=xml --cov-report=term-missing --junitxml=pytest-report.xml 2>&1 | tee pytest-output.txt
        code=${PIPESTATUS[0]}
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Surface pytest failures
      if: steps.pytest.outputs.exit_code != '0'
      run: |
        python - <<'PY'
        from pathlib import Path

        output = Path("pytest-output.txt").read_text(encoding="utf-8", errors="replace")
        lines = output.splitlines()
        important = []
        capture = False
        for line in lines:
            if line.startswith("=================================== FAILURES") or line.startswith("==================================== ERRORS"):
                capture = True
            if capture:
                important.append(line)
        if not important:
            important = lines[-80:]
        text = "\n".join(important[-80:])
        text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
        print(f"::error title=pytest exited non-zero::{text}")
        raise SystemExit(1)
        PY

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        pip install bandit safety

    - name: Run bandit security scan
      run: |
        # Keep a machine-readable report even when findings exist, then enforce
        # the release gate with a second medium-or-higher severity scan.
        bandit -r "Hive Ops DevAI" bootstrap installer updates -f json -o bandit-report.json || true
        bandit -r "Hive Ops DevAI" bootstrap installer updates -ll

    - name: Upload security scan results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-scan
        path: bandit-report.json

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Create distribution package
      run: |
        mkdir -p dist
        tar -czf dist/hive-ops-devai.tar.gz \
          --exclude=.git \
          --exclude=__pycache__ \
          --exclude=*.pyc \
          --exclude=.pytest_cache \
          --exclude=brain-plug/escape_living_ai.txt \
          "Hive Ops DevAI" "Hive Ops Final" "Hermes Plugins" brain-plug install.sh README.md requirements.txt

    - name: Create standalone clean-install bootstrap
      run: |
        python -m zipapp bootstrap \
          -o dist/hive-bootstrap.pyz \
          -p "/usr/bin/env python3"
        python dist/hive-bootstrap.pyz --help
        sha256sum dist/hive-bootstrap.pyz > dist/hive-bootstrap.pyz.sha256

    - name: Upload Hive package
      uses: actions/upload-artifact@v4
      with:
        name: hive-ops-package
        path: dist/hive-ops-devai.tar.gz

    - name: Upload clean-install bootstrap
      uses: actions/upload-artifact@v4
      with:
        name: hive-clean-install-bootstrap
        path: |
          dist/hive-bootstrap.pyz
          dist/hive-bootstrap.pyz.sha256
