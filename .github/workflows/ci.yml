name: Hive OS FINAL Production CI

on:
  push:
    branches: [ master, main, develop, hive-1.1-rc2-bootstrap, hive-v2-remediation ]
  pull_request:
    branches: [ master, main, hive-v2-remediation ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate workflow action pins
        run: python scripts/validate_workflow_pins.py

      - name: Lint critical errors (required gate)
        run: |
          flake8 bin core config_engine diagnostics hive_broker installer lib network operations_center policy_engine release_engine runtime_logs security services updates --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint production code (informational)
        run: |
          flake8 bin core config_engine diagnostics hive_broker installer lib network operations_center policy_engine release_engine runtime_logs security services updates --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Type check production code (informational)
        run: |
          mypy bin core config_engine diagnostics hive_broker installer lib network operations_center policy_engine release_engine runtime_logs security services updates --ignore-missing-imports || true

      - name: Test with pytest
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest -v tests             --cov=bin --cov=core --cov=config_engine --cov=diagnostics --cov=hive_broker             --cov=installer --cov=lib --cov=network --cov=operations_center             --cov=policy_engine --cov=release_engine --cov=runtime_logs --cov=security             --cov=services --cov=updates             --cov-report=xml --cov-report=term-missing --junitxml=pytest-report.xml 2>&1 | tee pytest-output.txt

      - name: Surface pytest failures
        if: steps.pytest.conclusion == 'failure'
        run: |
          python - <<'PY'
          from pathlib import Path

          output_path = Path("pytest-output.txt")
          if not output_path.is_file():
              print("::error title=pytest failure::Pytest failed before diagnostics were captured.")
              raise SystemExit(1)

          output = output_path.read_text(encoding="utf-8", errors="replace")
          lines = output.splitlines()
          summary = [line for line in lines if line.startswith(("FAILED ", "ERROR "))]

          def emit(text: str) -> None:
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=pytest failure::{text}")

          if summary:
              for line in summary[:40]:
                  emit(line)
          else:
              start = next(
                  (
                      i
                      for i, line in enumerate(lines)
                      if line.startswith("=================================== FAILURES")
                      or line.startswith("==================================== ERRORS")
                  ),
                  max(0, len(lines) - 30),
              )
              emit("\n".join(lines[start : start + 30]))
          raise SystemExit(1)
          PY

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Run repository secret marker gate
        run: python scripts/secret_scan_gate.py

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          # Keep a machine-readable report even when findings exist, then enforce
          # the production release gate with a second medium-or-higher severity scan.
          bandit -r bootstrap installer updates release_engine services network diagnostics hive_broker policy_engine security -f json -o bandit-report.json || true
          bandit -r bootstrap installer updates release_engine services network diagnostics hive_broker policy_engine security -ll

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-scan
          path: bandit-report.json

  build:
    name: Canonical production package validation
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build canonical unsigned CI candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/final-ci-candidate
          mkdir -p dist/final-ci-candidate
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m release_engine.cli build \
            --source "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/dist/final-ci-candidate" \
            --version "1.1.0-rc.0" \
            --sequence 0 \
            --build-id "ci-${GITHUB_SHA:0:12}" \
            --revision "$GITHUB_SHA" \
            --platforms termux \
            --architectures aarch64 \
            --channel ci
          bundle=$(find dist/final-ci-candidate -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$bundle"
          python -m release_engine.cli inspect "$bundle" --work-dir "$RUNNER_TEMP/hive-ci-inspect"

      - name: Validate deprecated/reference trees are excluded
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(find dist/final-ci-candidate -maxdepth 1 -name '*.manifest.json' -print -quit)
          python - "$manifest" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          paths = {entry["path"] for entry in manifest}
          forbidden_prefixes = (
              "blueprints/",
              "evidence/",
          )
          bad = sorted(path for path in paths if path.startswith(forbidden_prefixes))
          if bad:
              raise SystemExit(f"reference-only path entered production manifest: {bad[0]}")
          for required in ("bin/hive", "hive-canonical.json", "installer/activate.py", "network/manager.py", "services/supervisor.py"):
              if required not in paths:
                  raise SystemExit(f"canonical production manifest missing: {required}")
          print("canonical production manifest boundary: PASS")
          PY

      - name: Create standalone clean-install bootstrap
        run: |
          python -m zipapp bootstrap -o dist/hive-bootstrap.pyz
          python dist/hive-bootstrap.pyz --help
          python dist/hive-bootstrap.pyz install --help
          python dist/hive-bootstrap.pyz verify --help
          sha256sum dist/hive-bootstrap.pyz > dist/hive-bootstrap.pyz.sha256

      - name: Upload canonical CI candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hive-final-ci-candidate
          path: dist/final-ci-candidate/
          if-no-files-found: error

      - name: Upload clean-install bootstrap
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hive-clean-install-bootstrap
          path: |
            dist/hive-bootstrap.pyz
            dist/hive-bootstrap.pyz.sha256

  termux-smoke:
    name: Termux smoke simulation
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Termux install script syntax
        run: bash -n install-termux-easy.sh

      - name: Simulate Termux prefix install
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/termux"
          export TERMUX_PREFIX="$RUNNER_TEMP/termux/usr"
          export PREFIX="$TERMUX_PREFIX"
          export HOME="$RUNNER_TEMP/termux/home"
          mkdir -p "$TERMUX_PREFIX" "$HOME"
          if grep -q -- "--dry-run\|--check" install-termux-easy.sh; then
            bash install-termux-easy.sh --dry-run || bash install-termux-easy.sh --check
          else
            echo "::notice::install-termux-easy.sh does not expose a dry-run/check mode; skipping live install"
          fi

      - name: Run unit tests for Termux-relevant modules
        run: |
          pytest tests/test_bootstrap_install_release.py tests/test_bootstrap_finalization_transaction.py tests/test_service_process.py tests/test_service_restart.py -v
