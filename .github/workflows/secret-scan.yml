name: Hive OS Secret Scan

on:
  push:
    branches: [ master, main, hive-v2-remediation ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Run current-tree secret marker gate
        run: python scripts/secret_scan_gate.py
