name: Hive OS Secret Scan

on:
  push:
    branches: [ master, main, hive-v2-remediation ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Run current-tree secret marker gate
        run: python scripts/secret_scan_gate.py
