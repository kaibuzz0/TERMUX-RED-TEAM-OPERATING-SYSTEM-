name: Hive OS Secret Scan

on:
  push:
    branches: [ master, main, hive-v2-remediation ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Run current-tree secret marker gate
        run: python scripts/secret_scan_gate.py
